  /v1/vehicles/{vehicle_id}/history/snapped:
    get:
      description: Map-matches the raw GPS trace so the line follows roads instead
        of cutting corners and wandering through buildings. Where the matcher cannot
        join two consecutive fixes it ends one match and begins another, leaving a
        short hole — usually a couple of kilometres at an interchange; those holes
        are closed by routing between the two matched ends, and `gaps_bridged` counts
        them, because a bridged stretch is inferred rather than observed. `chunks_matched`
        below `chunks_total` means a whole section failed, typically an unmapped yard
        or plantation track. Costs several provider requests (the trace is split into
        chunks of 200 fixes and matched in parallel), so it is requested explicitly
        rather than being folded into the history response — and the raw trace remains
        available, because the matched line is an interpretation and the fixes themselves
        are what matter in a dispute. `distance_km` is measured along roads. `chunks_matched`
        below `chunks_total` means part of the journey was unmatchable — typically
        an unmapped yard or plantation track.
      parameters:
      - description: vehicle id
        in: path
        name: vehicle_id
        required: true
        type: integer
      - description: RFC3339 start
        in: query
        name: from
        required: true
        type: string
      - description: RFC3339 end
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/liveview.SnappedHistory'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: A vehicle's travelled path, snapped to the road network
      tags:
      - live-view
