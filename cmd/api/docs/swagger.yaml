  /v1/dashcams/{id}/download:
    post:
      consumes:
      - application/json
      description: Asks the telemetry service to pull the clip to S3; returns a job
        id to poll. Poll /v1/dashcams/downloads/{jobId}; on completion FMS records
        the clip in video_clips. With alarm_id, the clip is recorded against that
        camera event (an SD-card pull for an event without a saved video).
      parameters:
      - description: dashcam id
        in: path
        name: id
        required: true
        type: integer
      - description: clip
