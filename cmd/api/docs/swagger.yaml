  /v1/service-schedules/{id}/dispatch:
    post:
      consumes:
      - application/json
      description: 'Marks the schedule in_service, the vehicle under repair, and returns
        the route from the vehicle''s current position to the hangar, with its toll.
        `toll_rp` is for this vehicle''s own class, derived from its axle count; when
        no axle count is recorded — 47% of the legacy fleet — `toll_by_golongan` lists
        every class instead and `toll_note` says why. An absent toll always carries
        a note, because a missing figure would otherwise read as a toll-free trip.
        Both routing and toll are computed in-house: Valhalla for the route, and FMS''s
        own toll_gates/toll_tariffs for the price, by finding which gates the route
        passes and which charges they make up. A gate no tariff covers is priced at
        zero and NAMED in `toll_unpriced_gates`, so the total is useful while staying
        visibly short — `toll_note` then reads "at least this much". That distinction
        matters: Rp 0 for an unpriced gate and Rp 0 for a genuinely toll-free road
        are the same number meaning opposite things. An external provider remains
        wired as a fallback for routes the tables cannot price at all.'
      parameters:
      - description: service schedule id
        in: path
        name: id
        required: true
        type: integer
      - description: hangar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/maintenance.DispatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/maintenance.DispatchResult'
        "409":
          description: already in service
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Send a vehicle to a hangar for a due service
      tags:
      - maintenance
  /v1/service-schedules/{id}/route:
    get:
      description: 'Routes from the vehicle''s CURRENT position to the hangar its
        service schedule names, with the toll for the remaining journey. Read-only
        and safe to poll: unlike the dispatch call it records nothing, which is what
        lets Live View draw the remaining path as the truck moves. The figures stored
        at dispatch are deliberately not reused — the vehicle has been driving since,
        so they describe a journey that no longer starts where it starts now. `already_there`
        means the vehicle is inside the hangar''s radius and no line is returned.'
      parameters:
      - description: service schedule id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/maintenance.RouteToHangar'
        "404":
          description: no such schedule, or it has no hangar
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: schedule has no vehicle to route
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: routing not configured
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: The remaining journey from a vehicle to its hangar
      tags:
      - maintenance
  /v1/special-reports/driver-truck-distance:
    get:
      description: |-
        Every non-archived truck of the caller's account with its tracker's last location, its assigned driver's last K-Trip phone location, and the straight-line distance between them in metres. The response shape matches the old GPS platform's feed field for field, so an existing consumer can switch without changing its parser.

        Rules carried over from that feed: `_id` and `driver` are master-data ObjectIds; `lastLocation` falls back to the driver's phone fix when it is newer than the tracker's last fix (distance is then 0, and `lastGPS` still shows the tracker's own last fix time); tracker `batteryLevel` is the external supply in volts, flagged in `errorDesc` as BATT_LOW under 8 V and BATT_WARNING under 24.5 V; LOST_GPS is added for a 0,0 fix. Positions are null when telemetry has none (or is unreachable).

        Authenticate with the account's API key (`Authorization: Bearer fms_...` or `X-Api-Key: fms_...`) or a signed-in session.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/specialreport.Response'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Truck vs driver last location (legacy feed format)
      tags:
      - special-report
  /v1/toll/quote:
    post:
      consumes:
