      consumes:
      - application/json
      description: 'Moving a geofence or changing its radius ENDS every open visit
        at it: the stays recorded so far happened at the old circle, and leaving them
        open would attribute time to a place that is no longer where it was. Vehicles
        inside the new circle open a fresh visit on the next collector pass.'
      parameters:
      - description: geofence id
        in: path
        name: id
        required: true
        type: integer
      - description: geofence
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/geofence.UpsertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/geofence.Geofence'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Edit a geofence
      tags:
      - geofences
  /v1/geofences/{id}/presence:
    get:
      description: Longest stay first. `dwell_min` counts from the first fix inside,
        including the part before the arrival delay confirmed it. A vehicle that only
        clipped the edge never appears.
      parameters:
      - description: geofence id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/site.Visit'
            type: array
      security:
      - BearerAuth: []
      summary: Vehicles inside a geofence right now, and since when
      tags:
      - geofences
  /v1/geofences/{id}/vehicles:
    get:
      description: An empty list means the geofence watches every vehicle in the account.
        Attaching narrows it.
      parameters:
      - description: geofence id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/geofence.AssignedVehicle'
            type: array
      security:
      - BearerAuth: []
      summary: Vehicles attached to a geofence (they get Enter/Exit alerts)
      tags:
      - geofences
  /v1/geofences/{id}/vehicles/{vehicleID}:
    delete:
      parameters:
      - description: geofence id
        in: path
        name: id
        required: true
        type: integer
      - description: vehicle id
        in: path
        name: vehicleID
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Detach a vehicle from a geofence
      tags:
      - geofences
    post:
      parameters:
      - description: geofence id
        in: path
        name: id
        required: true
        type: integer
      - description: vehicle id
        in: path
        name: vehicleID
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Attach a vehicle to a geofence (starts Enter/Exit alerts for it)
      tags:
      - geofences
  /v1/geofences/visits:
    get:
      description: Every visit overlapping the window, oldest arrival first. Omit
        `geofence_ids` for all of them. A visit still open has a null `exited_at`
        and a `dwell_min` counted up to now.
      parameters:
      - description: RFC3339
        in: query
        name: from
        required: true
        type: string
      - description: RFC3339
        in: query
        name: to
        required: true
        type: string
      - description: 'comma-separated geofence ids (default: all)'
        in: query
        name: geofence_ids
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/site.Visit'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 'Movement log: who entered and left which geofence, in time order'
      tags:
      - geofences
  /v1/hangars:
    get:
      description: '`booked` counts open service schedules assigned here; `present`
        counts vehicles whose last position is inside the radius. They are deliberately
        separate — booked-but-absent is a no-show, present-but-unbooked is unplanned
        work.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/hangar.Hangar'
            type: array
      security:
      - BearerAuth: []
      summary: Maintenance hangars, with how many vehicles are booked and present
      tags:
      - hangars
    post:
      consumes:
      - application/json
      parameters:
      - description: hangar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/hangar.UpsertRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/hangar.Hangar'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add a maintenance hangar (admin only)
      tags:
      - hangars
  /v1/hangars/{id}:
    delete:
      description: Service schedules pointing here are kept and their hangar is cleared,
        rather than the delete being blocked — losing the maintenance history to tidy
        up a location would be the worse trade.
      parameters:
      - description: hangar id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete a hangar (admin only)
      tags:
      - hangars
    put:
      consumes:
      - application/json
      parameters:
      - description: hangar id
        in: path
        name: id
        required: true
        type: integer
      - description: hangar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/hangar.UpsertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hangar.Hangar'
      security:
      - BearerAuth: []
      summary: Update a hangar (admin only)
      tags:
      - hangars
  /v1/hangars/{id}/route:
    get:
      description: Planned on the heavy-goods profile, so weight and height restrictions
        are respected — a car route that sends a 40ft trailer down a residential shortcut
        is worse than none. `duration_min` is a free-flow estimate with no traffic,
        loading or break time in it. Returns `already_there` without a route when
        the vehicle is inside the hangar radius.
      parameters:
      - description: hangar id
        in: path
        name: id
        required: true
        type: integer
      - description: vehicle id
        in: query
        name: vehicle_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hangar.RouteToHangar'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Drivable route from a vehicle's current position to a hangar
      tags:
      - hangars
  /v1/hangars/{id}/vehicles:
    get:
      parameters:
      - description: hangar id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/hangar.VehicleAtHangar'
            type: array
      security:
      - BearerAuth: []
      summary: Vehicles booked at, or currently sitting in, one hangar
      tags:
      - hangars
  /v1/insights/action-queue:
    get:
      description: Merges unchecked alerts, expiring documents, due services, idle
        assets and low batteries into one ordered worklist. Alerts respect `check_status`,
        so marking one checked removes it from the queue.
      parameters:
      - description: max items (default 25)
        in: query
        name: limit
        type: integer
      - description: how far ahead to look for expiries (default 30)
        in: query
        name: horizon_days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/insight.QueueItem'
            type: array
      security:
      - BearerAuth: []
      summary: Everything currently waiting on a person, ranked
      tags:
      - insights
  /v1/insights/anomalies:
    get:
      description: Compares each vehicle's last 3 complete days against its own prior
        daily history, reporting a change only when it exceeds that vehicle's normal
        day-to-day variation (z-score >= 2) AND moves by a materially useful amount.
        Today is excluded because it is still being written. At most one finding per
        vehicle, each with a ready-made headline.
      parameters:
      - description: max findings (default 20)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/insight.AnomalyResponse'
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Vehicles behaving differently from their own normal
      tags:
      - insights
  /v1/insights/battery-watch:
    get:
      description: Readings below 6V are ignored as absent sensors rather than flat
        batteries. Each finding carries a recommendation and a `scheduled` flag; POST
        to the schedule-service action to book a replacement into the maintenance
        module.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/insight.BatteryFinding'
            type: array
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Vehicles with a weak or failing battery, and whether a service is booked
      tags:
      - insights
  /v1/insights/battery-watch/{vehicle_id}/schedule-service:
    post:
      consumes:
      - application/json
      description: 'Turns a battery finding into a real service schedule, so it appears
        in Maintenance and in the action queue alongside every other due job. Idempotent:
        if an open battery service already exists for the vehicle it is returned rather
        than duplicated. A critical reading defaults to due today, a weak one to seven
        days out.'
      parameters:
      - description: vehicle id
        in: path
        name: vehicle_id
        required: true
        type: integer
      - description: optional overrides
        in: body
        name: body
        schema:
          $ref: '#/definitions/insight.ScheduleServiceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Book a battery replacement into the maintenance schedule
      tags:
      - insights
  /v1/insights/utilisation-peers:
    get:
      description: Compares each vehicle's distance per active day against the median
        of its fleet group (or vehicle type when ungrouped). Groups of fewer than
        4 are skipped — a "median" of two vehicles is not one. Median rather than
        mean, so parked or broken vehicles do not drag the comparison down and make
        genuinely underused ones look normal.
      parameters:
      - description: max findings (default 20)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/insight.PeerComparison'
            type: array
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Vehicles well below the median utilisation of their own group
      tags:
      - insights
  /v1/integration/vehicles/{imei}/analytics:
    get:
      description: 'Same consolidated analytics as /v1/vehicles/{id}/analytics, but
        keyed by device IMEI and authenticated with a per-tenant API token (header
        `X-Api-Key: fms_...` or `Authorization: Bearer fms_...`). The IMEI is resolved
        within the token''s account only.'
      parameters:
      - description: device IMEI
        in: path
        name: imei
        required: true
        type: string
      - description: RFC3339
        in: query
        name: from
        required: true
        type: string
      - description: RFC3339
        in: query
        name: to
        required: true
        type: string
      - description: overspeed limit km/h (default 60)
        in: query
        name: limit
        type: number
      - description: minutes a stop must exceed to count as idle (default 120)
        in: query
        name: idle_threshold
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/liveview.VehicleAnalytics'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: External vehicle analytics by IMEI (history + calculations)
      tags:
      - integration
  /v1/live-view:
    get:
      parameters:
      - description: filter fleet group
        in: query
        name: fleet_group_id
        type: integer
      - description: 'platform_admin: every account''s vehicles'
        in: query
        name: all_accounts
        type: boolean
      - description: 'platform_admin: one account''s vehicles'
        in: query
        name: account_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_karlo_fms-backend_internal_platform_httpx.List-liveview_VehicleLive'
      security:
      - BearerAuth: []
      summary: 'Live map feed: active vehicles + their latest positions'
      tags:
      - live-view
  /v1/live-view/{vehicle_id}:
    get:
      parameters:
      - description: vehicle id
        in: path
        name: vehicle_id
        required: true
        type: integer
      - description: 'platform_admin: the vehicle''s account (cross-tenant)'
        in: query
        name: account_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/liveview.VehicleLive'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Live detail for a single vehicle
      tags:
      - live-view
  /v1/notification-rules:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_karlo_fms-backend_internal_platform_httpx.List-notifrule_DTO'
      security:
      - BearerAuth: []
      summary: List notification rules
      tags:
      - notification-rules
    post:
      consumes:
      - application/json
      parameters:
      - description: rule
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/notifrule.WriteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/notifrule.DTO'
      security:
      - BearerAuth: []
      summary: Create a notification rule
      tags:
      - notification-rules
  /v1/notification-rules/{id}:
    delete:
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete a notification rule
      tags:
      - notification-rules
    get:
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notifrule.DTO'
      security:
      - BearerAuth: []
      summary: Get a notification rule
      tags:
      - notification-rules
    put:
      consumes:
      - application/json
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: integer
      - description: rule
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/notifrule.WriteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notifrule.DTO'
      security:
      - BearerAuth: []
      summary: Update a notification rule
      tags:
      - notification-rules
  /v1/notifications/mark-all-read:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              format: int64
              type: integer
            type: object
      security:
      - BearerAuth: []
      summary: Mark all unchecked alerts as checked (mark all read)
      tags:
      - alerts
  /v1/platform/backfill-vehicles:
    post:
      description: Vehicles created in FMS before write-through existed have no master_data_id
        and are invisible to TMS. This creates them upstream and records the pairing.
        Idempotent. Pass ?dry_run=true to list what would be pushed without writing.
      parameters:
      - description: the account to backfill (defaults to the caller's)
        in: query
        name: account_id
        type: integer
      - description: report without writing
        in: query
        name: dry_run
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/platformadmin.BackfillResult'
      security:
      - BearerAuth: []
      summary: Push FMS-only vehicles up into master data
      tags:
      - platform
  /v1/platform/catalog-audit:
    get:
      description: 'For every account: each distinct manufacturer, vehicle_type and
        box_type on vehicles paired with master data, with the catalogue entry it
        resolves to by normalised name (manufacturer→brand; box_type→truck body; vehicle_type→truck
        body first, then truck head) or "none". The "none" rows are the operator''s
        to map or add in TMS''s catalogue; apply (POST) pushes the matched ones.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/platformadmin.CatalogAudit'
        "503":
          description: master data not configured
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Free-text vehicle brand/type/body values vs master data's catalogues
        (platform admin)
      tags:
      - platform
  /v1/platform/catalog-audit/apply:
    post:
      description: For every paired vehicle whose free-text values resolve in the
        audit, PUT /vehicles/{id} upstream with brandId / truckBodyId / truckHeadId,
        as the operator (acting for each account). Unmatched values are left alone.
        Idempotent — run it again after adding catalogue entries.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/platformadmin.CatalogApplyResult'
        "503":
          description: master data not configured
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Push the matched brand/body/head ids to master data (platform admin)
      tags:
      - platform
  /v1/platform/fuel-prices:
    post:
      consumes:
      - application/json
      parameters:
      - description: price
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/sop.NationalPrice'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sop.NationalPrice'
      security:
      - BearerAuth: []
      summary: Record a national fuel price change (platform staff)
      tags:
      - fuel
  /v1/platform/groups-backfill:
    post:
      description: 'For every account, as the operator: create each fleet group master
        data lacks (adopting one with the same name if it exists) and record it as
        paired; then set truckGroupId on every paired vehicle from its FMS fleet group.
        Run once before switching GROUPSYNC_MEMBERSHIP on; idempotent.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/platformadmin.GroupsBackfillResult'
        "503":
          description: master data not configured
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Push FMS fleet groups and memberships to master data (platform admin)
      tags:
      - platform
  /v1/platform/overview:
    get:
      description: 'Totals across every account: accounts, vehicles, online, and a
        per-account breakdown. Restricted to platform_admin.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/platformadmin.Overview'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Platform-wide overview (platform admin)
      tags:
      - platform
  /v1/platform/sync:
    post:
      description: Asks vehiclesync and driversync to pull every company's fleet and
        drivers from master data immediately instead of at their next tick. The pass
        runs in the background; the response says only that it was requested. Master-data
        change notices on the platform Redis do the same automatically.
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "503":
          description: no projection configured (pre-cutover deployment)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Refresh the master-data projections now (platform admin)
      tags:
      - platform
  /v1/platform/tenants/{id}/name:
    put:
      consumes:
      - application/json
      description: 'Change an account''s display name. Companies belong to the authentication
        service: the rename is sent there as the calling operator (PUT /api/v1/admin/companies/{id}),
        and the local copy follows — immediately here, and again from the company
        notice tenantsync receives. platform_admin only.'
      parameters:
      - description: tenant id
        in: path
        name: id
        required: true
        type: integer
      - description: '{\'
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Rename a customer account (platform admin)
      tags:
      - platform
  /v1/platform/trackers/diff:
    get:
      description: 'For every account, the device register as FMS holds it against
        the register in master data, device by device. Verdicts: agree, differ (fitted
        to different vehicles — the one that matters), fms_only, masterdata_only,
        unpaired (no master_data_id here yet), unknown_vehicle (master data names
        a vehicle this account cannot resolve). Rows that agree are summarised in
        the counts and omitted from the list. Read-only: nothing is written anywhere.
        Run this before switching device writes or history resolution over, so a correction
        cannot silently move a live mapping.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/platformadmin.TrackerDiff'
        "503":
          description: master data not configured
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Compare FMS device fittings with master data (platform admin)
      tags:
      - platform
  /v1/platform/trackers/export:
    get:
      description: 'FMS''s own device registry as one list: GPS trackers (kind=gps,
        device_id=IMEI, phone_no, status, external_ref) and dashcams (kind=dashcam,
        device_id=VSS device id), each with its account, the account''s master-data
        company id, and the current fitting (vehicle, its master-data id, plate, fitted_at
        from the open tracker_assignments row — has_assignment_history=true — else
        the tracker''s created_at as an estimate). Devices in stock are included with
        no vehicle fields. For the one-off reconcile that makes master data the owner
        of devices; restricted to platform_admin.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_karlo_fms-backend_internal_platform_httpx.List-platformadmin_TrackerExport'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
