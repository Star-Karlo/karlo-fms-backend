          (which does NOT see idle, so it under-counts on idle-heavy trips).
        type: string
      cost_per_hour:
        description: fuel cost ÷ engine-on hours
        type: number
      cost_per_km:
        description: fuel cost ÷ distance
        type: number
      cost_rp:
        description: used_liters × price
