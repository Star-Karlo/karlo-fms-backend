      - BearerAuth: []
      summary: List documents with expiry status (License module)
      tags:
      - license
    post:
      consumes:
      - application/json
      description: 'Two-step upload: this creates the row and returns a short-lived
        S3 PUT URL. The client then PUTs the file directly to that URL with exactly
        the headers in `required_headers`. The row exists before the file does; until
        the PUT completes, download returns 404.'
      parameters:
      - description: document metadata
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/document.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/document.CreateResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a document record and get a presigned upload URL
      tags:
      - documents
  /v1/documents/{id}:
    delete:
      description: Removes the record and best-effort deletes the S3 object. The bucket
        is versioned, so a deletion is recoverable by an administrator.
      parameters:
      - description: document id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a document and its file
      tags:
      - documents
  /v1/documents/{id}/download:
    get:
      description: Returns a short-lived URL rather than the bytes, so the file is
        served by S3 directly. 404 if the record exists but no file was ever uploaded
        to it.
      parameters:
      - description: document id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
