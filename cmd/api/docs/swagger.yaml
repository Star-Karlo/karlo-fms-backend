        type: string
      radius_m:
        type: integer
    type: object
  hangar.VehicleAtHangar:
    properties:
      component:
        type: string
      distance_m:
        description: DistanceM is how far away it is, so a no-show can be chased.
        type: integer
      due_at:
        type: string
      license_plate:
        type: string
      present:
        description: |-
          Present is whether the vehicle is physically here right now, which is not
          the same as being booked here.
        type: boolean
      status:
        type: string
