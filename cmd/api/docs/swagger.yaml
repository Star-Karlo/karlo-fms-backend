          moving).
        type: number
      ignition:
        type: boolean
      lat:
        type: number
      lon:
        type: number
      over_limit:
        description: OverLimit is true when Speed exceeds the requested limit at this
          point.
        type: boolean
      source:
        description: |-
          Source is "tracker" or "camera". Always set; matters when a caller asks
          for both and gets one interleaved track to draw as two.
        type: string
      speed:
        type: number
      time:
        type: string
    type: object
