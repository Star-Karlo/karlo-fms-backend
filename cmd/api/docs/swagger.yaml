info:
  contact: {}
  description: 'Application API for the Fleet Management System: authentication, master
    data, and live vehicle tracking (joined with the telemetry service).'
  title: Karlo FMS Platform API
  version: "0.1"
paths:
  /public/track/{token}:
    get:
      parameters:
      - description: link token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/trackinglink.PublicResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "410":
          description: Gone
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Public live view for a shared tracking link (no auth)
      tags:
      - tracking-links
  /v1/admin/restore:
    post:
      consumes:
      - application/json
      description: Pulls archived alerts/driving_events for a date range back into
        the database for the caller's tenant. Idempotent (already-present rows are
        skipped). Runs in the background; watch the service logs for the final counts.
      parameters:
      - description: Table and inclusive date range
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/retention.RestoreRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Restore archived rows from cold storage (admin)
      tags:
      - admin
  /v1/ai/dashboard/compose:
    post:
      consumes:
      - application/json
      description: |-
        Given the caller's role, a natural-language description and the
        client's metric catalog, returns a list of tiles (metric + params +
        visualisation + layout). The caller validates and may reject them —
        the model is a proposer, not an authority.
      parameters:
      - description: prompt + catalog
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/aidash.composeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/aidash.composeResponse'
        "400":
          description: prompt or catalog missing
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: AI composition not configured
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Compose a dashboard from a description
      tags:
      - ai
  /v1/ai/notification-rules/compose:
    post:
      consumes:
      - application/json
      description: |-
        Given a natural-language request, returns a list of proposed
        notification rules (event + count threshold + time window +
        urgency). The caller reviews and saves them — the model proposes,
        it does not persist.
      parameters:
      - description: prompt
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/airule.composeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/airule.composeResponse'
        "400":
          description: prompt missing
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: AI composition not configured
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Compose notification rules from a description
      tags:
      - ai
  /v1/ai/report/compose:
    post:
      consumes:
      - application/json
      description: Turns a description (and optionally a spreadsheet's headers) into
        a report spec. The spec is returned for review; nothing is saved.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/aireport.composeResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Compose a custom report with AI
      tags:
      - ai
  /v1/ai/report/inspect-file:
    post:
      consumes:
      - multipart/form-data
      description: Reads column headers and a few sample rows from an .xlsx so a report
        can be shaped to match it. The file is never stored.
      parameters:
      - description: an .xlsx file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/aireport.inspectResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Inspect an uploaded spreadsheet
      tags:
      - ai
  /v1/alert-taxonomy:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/alert.AlertType'
            type: array
      security:
      - BearerAuth: []
      summary: The master alert taxonomy
      tags:
      - alerts
  /v1/alerts:
    get:
      parameters:
      - description: search
        in: query
        name: q
        type: string
      - description: unchecked|checked|false_alert
        in: query
        name: check_status
        type: string
      - description: gps|camera
        in: query
        name: device_source
        type: string
      - description: urgent|important|info
        in: query
        name: severity
        type: string
      - description: taxonomy code
        in: query
        name: alert_code
        type: string
      - description: vehicle filter
        in: query
        name: vehicle_id
        type: integer
      - description: RFC3339
        in: query
        name: from
        type: string
      - description: RFC3339
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_karlo_fms-backend_internal_platform_httpx.List-alert_DTO'
      security:
      - BearerAuth: []
      summary: List alerts (Notification feed)
      tags:
      - alerts
  /v1/alerts/{id}:
    get:
      parameters:
      - description: alert id
        in: path
        name: id
        required: true
        type: integer
      - description: RFC3339 hint — enables cold-storage lookup for an archived alert
        in: query
        name: occurred_at
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/alert.Detail'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Alert detail with surrounding same-vehicle history
      tags:
      - alerts
  /v1/alerts/{id}/check:
    patch:
      consumes:
      - application/json
      parameters:
      - description: alert id
        in: path
        name: id
        required: true
        type: integer
      - description: status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/alert.CheckRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/alert.DTO'
      security:
      - BearerAuth: []
      summary: Set an alert's check status (checked / false_alert / unchecked)
      tags:
      - alerts
  /v1/alerts/analytics:
    get:
      parameters:
      - description: RFC3339
        in: query
        name: from
        type: string
      - description: RFC3339
        in: query
        name: to
        type: string
      produces:
      - application/json
