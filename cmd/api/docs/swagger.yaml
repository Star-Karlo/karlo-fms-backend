  /v1/fuel-stations:
    get:
      description: Shared reference data (OpenStreetMap, ODbL) — not tenant-scoped.
        Pass `bbox` as west,south,east,north in degrees to fetch only the current
        viewport. `truncated` is true when more stations matched than `limit` allowed;
        zoom in or raise the limit.
      parameters:
      - description: west,south,east,north (degrees)
        in: query
        name: bbox
        type: string
      - description: 'comma-separated: pertamina,shell,bp,vivo,akr,total,other'
        in: query
        name: brand
        type: string
      - description: max rows (default and max 10000)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fuel.ListResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Fuel stations, optionally within a bounding box
      tags:
      - fuel-stations
  /v1/fuel-stations/brands:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/fuel.BrandCount'
            type: array
      security:
      - BearerAuth: []
      summary: Available fuel-station brands, with counts
      tags:
      - fuel-stations
  /v1/fuel/analysis:
    get:
      description: 'Per-vehicle estimated fuel use and cost over the last N days:
        distance ÷ configured km/L, plus idle burn and full-tank range. Price and
        idle rate are overridable.'
      parameters:
      - description: window in days (default 30, max 35)
        in: query
        name: days
        type: integer
      - description: price per litre (default 6800)
        in: query
        name: price
        type: number
      - description: idle litres/hour (default 2.5)
        in: query
        name: idle_lph
        type: number
      - description: scope to one vehicle (0/omitted = whole fleet)
        in: query
        name: vehicle_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fuelanalysis.Response'
      security:
      - BearerAuth: []
      summary: Fleet fuel analysis (estimated from telemetry distance)
      tags:
      - fuel
