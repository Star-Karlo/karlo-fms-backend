      engine_hours:
        description: Operating time over the window, from ignition + speed per fix.
        type: number
      fuel_end_pct:
        type: number
      fuel_ratio_kmpl:
        description: configured, for comparison
        type: number
      fuel_readings:
        description: points that carried a fuel level
        type: integer
      fuel_start_pct:
        type: number
      idle_hours:
        description: engine-on but speed ≈ 0
        type: number
      kmpl_actual:
        description: distance ÷ used_liters (sensor-measured)
        type: number
      kmpl_configured:
        description: = fuel_ratio_kmpl (echo)
        type: number
      moving_hours:
        description: engine-on and moving
        type: number
      note:
        type: string
      points:
        type: integer
      refuel_events:
        type: integer
      refuel_liters:
        type: number
      refuel_pct:
        type: number
      refuels:
        description: where + how much + cost, per refuel
        items:
          $ref: '#/definitions/liveview.RefuelEvent'
        type: array
      tank_liters:
        description: from the vehicle record
        type: number
      thefts:
        description: |-
          Suspected fuel thefts (large fast drops). Always surfaced on the history —
          no toggle — because a theft is not something to opt into seeing.
        items:
          $ref: '#/definitions/liveview.TheftEvent'
        type: array
      used_liters:
        description: tank × used_pct (nil = no tank set)
        type: number
