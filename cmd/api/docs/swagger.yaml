  insight.Anomaly:
    properties:
      baseline:
        type: number
      change_pct:
        type: number
      fleet_group:
        type: string
      headline:
        description: |-
          Headline is a ready-to-display sentence, built server-side so every client
          and the AI narrator describe a finding identically.
        type: string
      license_plate:
        type: string
      metric:
        description: 'Metric is which measure moved: idle_pct | distance | moving_hours
          | stopped.'
        type: string
      recent:
        type: number
      severity:
        $ref: '#/definitions/insight.Severity'
      sigma:
        description: |-
          Sigma is how many standard deviations of this vehicle's OWN daily spread
          the change represents. Exposed because it is the number that decides
          whether a finding is real, and hiding it would make the ranking look
          arbitrary beside the more eye-catching percentage.
        type: number
      unit:
        type: string
      vehicle_id:
        type: integer
    type: object
  insight.AnomalyResponse:
    properties:
      baseline_days:
        type: integer
      items:
        items:
          $ref: '#/definitions/insight.Anomaly'
        type: array
      note:
        type: string
    type: object
  insight.BatteryFinding:
    properties:
      battery_v:
        type: number
      detail:
        type: string
      fleet_group:
        type: string
      kind:
        description: |-
          Kind separates a real battery problem from an implausible reading:
          "battery" | "sensor_fault". They need different people and different
          parts, so collapsing them into one list wastes a trip.
        type: string
      license_plate:
        type: string
      recommendation:
        type: string
      scheduled:
        description: |-
          Scheduled reports whether a battery service is ALREADY booked for this
          vehicle, so the client shows "scheduled" rather than offering the action
          again — and so a second click cannot create a duplicate.
        type: boolean
      severity:
        $ref: '#/definitions/insight.Severity'
      vehicle_id:
        type: integer
    type: object
  insight.PeerComparison:
    properties:
      deviation_pct:
        type: number
      headline:
        type: string
      idle_pct:
        type: number
      km_per_day:
        type: number
      license_plate:
        type: string
      peer_count:
        type: integer
      peer_group:
        type: string
      peer_median_idle_pct:
        type: number
      peer_median_km_per_day:
        type: number
      severity:
        $ref: '#/definitions/insight.Severity'
      vehicle_id:
        type: integer
    type: object
  insight.QueueItem:
    properties:
      detail:
        type: string
      due_in_days:
        description: DueInDays is negative when already overdue, null when not time-based.
        type: integer
      kind:
        description: 'Kind is the source: alert | document | service | idle_asset
          | battery.'
        type: string
      license_plate:
        type: string
      rank:
        description: |-
          Rank is the computed priority; exposed so the client can show why an item
          sits where it does rather than presenting an inscrutable order.
        type: integer
      ref_id:
        description: |-
          RefID identifies the row within its kind, so the client can deep-link and
          (for alerts) mark it checked.
        type: integer
      severity:
        $ref: '#/definitions/insight.Severity'
      title:
        type: string
      vehicle_id:
        type: integer
    type: object
