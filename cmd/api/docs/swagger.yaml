  /v1/platform/trackers/history-diff:
    get:
      description: 'Periods, not just the current fitting: for each account, every
        stretch during which a device sat on a vehicle, as FMS recorded it and as
        master data recorded it. Counts are agreed (both describe the same device
        on the same vehicle over an overlapping period), fms_only and masterdata_only
        (the other side has no row — usually nobody recorded it rather than a conflict,
        since both histories only hold fits made through their own API), and conflict,
        which is the one that matters: at one moment the two put the same device on
        DIFFERENT trucks. Only conflicts are listed. Read-only. Default window is
        the last 365 days; pass ?days= to change it.'
      parameters:
      - description: how far back to compare (default 365)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
