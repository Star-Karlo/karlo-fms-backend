  /v1/vehicles/history-summary:
    post:
      consumes:
      - application/json
      description: 'The figures from the history panel — distance, max speed, harsh
        events, idle — for a list of trucks named by plate or id, in ONE request.
        Plates are matched loosely, so "B 9012 UBC", "B9012UBC" and "b-9012-ubc" are
        one truck. Give neither list to get every tracked vehicle in the account.
        No track points come back; `fields` chooses which figures to compute, defaulting
        to the panel''s own set. Up to 50 vehicles and 31 days per call. A vehicle
        whose telemetry cannot be read comes back as a row carrying `error`, so one
        dead tracker does not fail the batch. READ `distance_source` AND `events_sampled`
        ON EACH ROW: distance is measured from every sample when the window starts
        at a local midnight and ends at a day boundary or now, and walked along a
        downsampled track otherwise; the event counts are lower bounds whenever the
        samples behind them are more than 30s apart.'
