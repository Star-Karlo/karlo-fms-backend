      tags:
      - hangars
  /v1/hangars/{id}:
    delete:
      description: Service schedules pointing here are kept and their hangar is cleared,
        rather than the delete being blocked — losing the maintenance history to tidy
        up a location would be the worse trade.
      parameters:
      - description: hangar id
        in: path
        name: id
        required: true
        type: integer
