basePath: /
definitions:
  aidash.composeRequest:
    properties:
      catalog:
        description: built client-side from the metric registry
        type: object
      current:
        description: existing tiles, so "add X" works
        type: object
      locale:
        description: |-
          Locale is the user's UI language. Asking the model to "reply in the
          language of the request" was not enough on its own — an Indonesian
          request came back with English titles — so the expected language is
          stated outright rather than inferred.
        type: string
      prompt:
        type: string
    type: object
  aidash.composeResponse:
    properties:
      attempts:
        type: integer
      notes:
        type: string
      tiles:
        type: object
      usage:
        $ref: '#/definitions/aidash.usage'
    type: object
  aidash.usage:
    properties:
      input_tokens:
        type: integer
      output_tokens:
        type: integer
    type: object
  aireport.composeResponse:
    properties:
      attempts:
        type: integer
      notes:
        type: string
      spec:
        $ref: '#/definitions/customreport.Spec'
      unmapped:
        description: |-
          Unmapped names spreadsheet headers no report can supply. Surfaced rather
          than dropped: a report that quietly omits a column the user asked for is
          worse than one that says it cannot fill it.
        items:
          type: string
        type: array
      usage:
        $ref: '#/definitions/aireport.usage'
    type: object
  aireport.inspectResponse:
    properties:
      headers:
        items:
          type: string
        type: array
      rows:
        type: integer
      sample:
        type: string
      sheet:
        type: string
    type: object
  aireport.usage:
    properties:
      input_tokens:
        type: integer
      output_tokens:
        type: integer
    type: object
  airule.composeRequest:
    properties:
      locale:
        type: string
      prompt:
        type: string
    type: object
  airule.composeResponse:
    properties:
      attempts:
        type: integer
      notes:
        type: string
      rules:
        items:
          type: integer
        type: array
      usage:
        $ref: '#/definitions/airule.usage'
    type: object
  airule.usage:
    properties:
      input_tokens:
        type: integer
      output_tokens:
        type: integer
    type: object
  alert.AlertSummary:
    properties:
      by_code:
        additionalProperties:
          format: int64
          type: integer
        description: |-
          ByCode is the fleet-wide tally, for a headline that does not need the
          per-vehicle breakdown summed client-side.
        type: object
      from:
        type: string
      items:
        items:
          $ref: '#/definitions/alert.VehicleAlertCounts'
        type: array
      to:
        type: string
      total:
        type: integer
    type: object
  alert.AlertType:
    properties:
      code:
        type: string
      name:
        description: Indonesian display name
        type: string
      name_en:
        description: English subtitle
        type: string
      scorecard:
        description: Scorecard indicates this alert type also feeds Driver Scorecard
          scoring.
        type: boolean
      severity:
        description: default severity
        type: string
      source:
        description: gps | camera
        type: string
    type: object
  alert.Analytics:
    properties:
      by_day:
        items:
          $ref: '#/definitions/alert.DayCount'
        type: array
      by_hour:
        items:
          $ref: '#/definitions/alert.HourCount'
        type: array
      by_severity:
        items:
          $ref: '#/definitions/alert.Bucket'
        type: array
      by_type:
        items:
          $ref: '#/definitions/alert.Bucket'
        type: array
      top_vehicles:
        items:
          $ref: '#/definitions/alert.VehCount'
        type: array
      total:
        type: integer
    type: object
  alert.Bucket:
    properties:
      count:
        type: integer
      key:
        type: string
      label:
        type: string
    type: object
  alert.CheckRequest:
    properties:
      check_status:
        description: unchecked (open) | followed_up | checked (resolved) | false_alert
        type: string
      note:
        type: string
    type: object
  alert.DTO:
    properties:
      actual_value:
        type: number
      address:
        type: string
      alert_code:
        type: string
      alert_name:
        type: string
      check_status:
        type: string
      checked_at:
        type: string
      checked_by:
        description: Who last changed check_status (a user id; the client resolves
          the name).
        type: integer
      device_source:
        type: string
      driver_id:
        type: integer
      driver_name:
        type: string
      id:
        type: integer
      lat:
        type: number
      license_plate:
        type: string
      limit_value:
        type: number
      lon:
        type: number
      media_url:
        type: string
      name_en:
        type: string
      note:
        type: string
      occurred_at:
        type: string
      severity:
        type: string
      source:
        type: string
      vehicle_id:
        type: integer
    type: object
  alert.DayCount:
    properties:
      count:
        type: integer
      day:
        type: string
    type: object
  alert.Detail:
    properties:
      alert:
        $ref: '#/definitions/alert.DTO'
      history:
        items:
          $ref: '#/definitions/alert.HistoryItem'
        type: array
    type: object
  alert.HistoryItem:
    properties:
      alert_code:
        type: string
      alert_name:
        type: string
      id:
        type: integer
      lat:
        type: number
      lon:
        type: number
      occurred_at:
        type: string
      severity:
        type: string
    type: object
  alert.HourCount:
    properties:
      count:
        type: integer
      hour:
        type: integer
    type: object
  alert.VehCount:
    properties:
      count:
        type: integer
      license_plate:
        type: string
      vehicle_id:
        type: integer
    type: object
  alert.VehicleAlertCounts:
    properties:
      counts:
        additionalProperties:
          format: int64
          type: integer
        description: |-
          Counts is keyed by ALERT CODE (OVERSPEED, HARSH_BRAKING, …), not by any
          consumer's categories: a caller groups codes into its own kinds, and
          this service does not inherit a vocabulary it cannot test.
        type: object
      license_plate:
        type: string
      total:
        type: integer
      vehicle_id:
        type: integer
    type: object
  apitoken.CreateRequest:
    properties:
      name:
        type: string
    type: object
  apitoken.DTO:
    properties:
      created_at:
        type: string
      id:
        type: integer
      issued_here:
        description: |-
          IssuedHere distinguishes a key FMS minted and verifies itself from one
          the shared auth service owns. It decides where revoking actually has to
          happen, so the list can say so instead of letting someone revoke a copy
          and wonder why the key still works.
        type: boolean
      last_used_at:
        type: string
      name:
        type: string
      revoked:
        type: boolean
      token:
        description: Token is populated ONLY in the create response (shown once).
        type: string
      token_prefix:
        type: string
    type: object
  apitoken.RemoveResult:
    properties:
      deleted:
        description: 'Deleted is the second: the row goes too.'
        type: boolean
      name:
        type: string
      revoked:
        description: |-
          Revoked is the first step: the key stops working, the row stays so the
          list still shows what it was and when it was last used.
        type: boolean
    type: object
  auth.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  auth.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: access token lifetime, seconds
        type: integer
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/auth.UserDTO'
    type: object
  auth.UserDTO:
    properties:
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      is_root:
        type: boolean
      role:
        type: string
      status:
        type: string
      tenant_id:
        type: integer
    type: object
  company.LogoUploadRequest:
    properties:
      filename:
        type: string
      mime:
        type: string
      size:
        type: integer
    type: object
  controltower.AlertLine:
    properties:
      alert_code:
        type: string
      alert_name:
        type: string
      id:
        type: integer
      occurred_at:
        type: string
      severity:
        type: string
    type: object
  controltower.Response:
    properties:
      groups:
        additionalProperties:
          items:
            $ref: '#/definitions/controltower.VehicleCard'
          type: array
        description: keyed by drive_state
        type: object
      summary:
        $ref: '#/definitions/controltower.Summary'
    type: object
  controltower.Summary:
    properties:
      checked_alerts:
        type: integer
      overspeeding_now:
        type: integer
      unchecked_alerts:
        type: integer
      unchecked_vehicles:
        type: integer
    type: object
  controltower.VehicleCard:
    properties:
      alerts:
        items:
          $ref: '#/definitions/controltower.AlertLine'
        type: array
      drive_state:
        type: string
      license_plate:
        type: string
      more_count:
        type: integer
      unchecked_count:
        type: integer
      vehicle_id:
        type: integer
      worst_severity:
        type: string
    type: object
  customreport.Cadence:
    enum:
    - daily
    - weekly
    - monthly
    type: string
    x-enum-varnames:
    - CadenceDaily
    - CadenceWeekly
    - CadenceMonthly
  customreport.Column:
    properties:
      key:
        type: string
      label:
        description: empty = the source's own label
        type: string
    type: object
  customreport.Definition:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      spec:
        $ref: '#/definitions/customreport.Spec'
      updated_at:
        type: string
    type: object
  customreport.Format:
    enum:
    - xlsx
    - pdf
    - docx
    - csv
    type: string
    x-enum-varnames:
    - FormatXLSX
    - FormatPDF
    - FormatDOCX
    - FormatCSV
  customreport.Range:
    properties:
      from:
        description: RFC3339, only when Preset is empty
        type: string
      preset:
        allOf:
        - $ref: '#/definitions/customreport.RangePreset'
        description: Preset is one of the RangePreset values. When set, From/To are
          ignored.
      to:
        type: string
    type: object
  customreport.RangePreset:
    enum:
    - today
    - yesterday
    - last_7_days
    - last_30_days
    - this_month
    - last_month
    - ""
    type: string
    x-enum-comments:
      RangeAbsolute: use From/To
    x-enum-descriptions:
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - use From/To
    x-enum-varnames:
    - RangeToday
    - RangeYesterday
    - Range7Days
    - Range30Days
    - RangeThisMonth
    - RangeLastMonth
    - RangeAbsolute
  customreport.Schedule:
    properties:
      cadence:
        $ref: '#/definitions/customreport.Cadence'
      day_of_month:
        type: integer
      day_of_week:
        description: DayOfWeek is 0=Sunday, weekly only. DayOfMonth is 1-28, monthly
          only.
        type: integer
      enabled:
        type: boolean
      format:
        $ref: '#/definitions/customreport.Format'
      hour:
        type: integer
      id:
        type: integer
      last_error:
        type: string
      last_run_at:
        type: string
      last_status:
        type: string
      next_run_at:
        type: string
      recipients:
        items:
          type: string
        type: array
      report_id:
        type: integer
      report_name:
        description: |-
          ReportName is joined in for display, so a list of schedules is readable
          without a second request per row.
        type: string
      subject:
        type: string
      timezone:
        type: string
    type: object
  customreport.Section:
    properties:
      columns:
        description: |-
          Columns optionally narrows and reorders the source's columns, and can
          rename them. Empty means "all of them, as the source ordered them".

          Renaming matters more than it looks: the point of a custom report is
          often that someone downstream expects "Nopol" where we say
          "license_plate", and forcing them to rename it every month is exactly
          the friction this feature exists to remove.
        items:
          $ref: '#/definitions/customreport.Column'
        type: array
      note:
        description: Note is printed under the section, for context the numbers do
          not carry.
        type: string
      params:
        additionalProperties: {}
        type: object
      source:
        description: a catalog key, e.g. "vehicle-trip-summary"
        type: string
      title:
        type: string
    type: object
  customreport.Spec:
    properties:
      format:
        allOf:
        - $ref: '#/definitions/customreport.Format'
        description: Format is the default the user picked; the download can override
          it.
      name:
        type: string
      narrative:
        description: |-
          Narrative overrides the by-format default: prose for pdf/docx, raw tables
          for xlsx/csv. Nil means "use the default", which is almost always right —
          the point is that the same saved report gives an executive a readable
          document and an analyst a spreadsheet, without being configured twice.
        type: boolean
      notes:
        description: free text printed under the title
        type: string
      range:
        $ref: '#/definitions/customreport.Range'
      sections:
        items:
          $ref: '#/definitions/customreport.Section'
        type: array
      version:
        type: integer
    type: object
  dashboard.LayoutResponse:
    properties:
      layout:
        items:
          type: integer
        type: array
    type: object
  dashcam.AttachRequest:
    properties:
      is_demo:
        description: |-
          IsDemo: this account only demos the camera; another account owns it.
          Not registered in master data.
        type: boolean
      vehicle_id:
        type: integer
      vss_device_id:
        type: string
    type: object
  dashcam.ClipDTO:
    properties:
      alarm_id:
        description: |-
          AlarmID is the camera event an auto-saved clip belongs to; EventCode and
          EventName name it. All nil for manual saves.
        type: string
      channel:
        type: integer
      clip_start:
        type: string
      created_at:
        type: string
      error:
        type: string
      event_code:
        type: integer
      event_name:
        type: string
      id:
        type: integer
      job_id:
        description: JobID of the telemetry download, for polling live stage while
          pending. Empty on list.
        type: string
      lat:
        type: number
      license_plate:
        type: string
      lon:
        type: number
      note:
        type: string
      reason:
        type: string
      s3_bucket:
        type: string
      s3_key:
        type: string
      size_bytes:
        type: integer
      status:
        description: pending | ready | failed | no_clip | deleted. s3_key/bucket are
          null until ready.
        type: string
      vehicle_id:
        type: integer
      vss_device_id:
        type: string
    type: object
  dashcam.ClipDayDTO:
    properties:
      bytes:
        type: integer
      clips:
        type: integer
      day:
        type: string
      events:
        type: integer
      failed:
        type: integer
      no_clip:
        type: integer
    type: object
  dashcam.ClipSummaryDTO:
    properties:
      days:
        items:
          $ref: '#/definitions/dashcam.ClipDayDTO'
        type: array
      from:
        type: string
      to:
        type: string
      totals:
        $ref: '#/definitions/dashcam.ClipTotalsDTO'
      trucks:
        items:
          $ref: '#/definitions/dashcam.ClipTruckDTO'
        type: array
      types:
        items:
          $ref: '#/definitions/dashcam.ClipTypeDTO'
        type: array
    type: object
  dashcam.ClipTotalsDTO:
    properties:
      avg_bytes_per_clip:
        type: number
      avg_bytes_per_truck_day:
        type: number
      avg_events_per_truck_day:
        description: Averages over the trucks with events and every day of the window.
        type: number
      bytes:
        type: integer
      clips:
        type: integer
      events:
        type: integer
      events_camera_didnt_send:
        type: integer
      events_save_failed:
        type: integer
      events_with_video:
        type: integer
      failed:
        type: integer
      no_clip:
        type: integer
      pending:
        type: integer
      trucks:
        type: integer
    type: object
  dashcam.ClipTruckDTO:
    properties:
      bytes:
        type: integer
      clips:
        type: integer
      events:
        type: integer
      events_camera_didnt_send:
        type: integer
      events_save_failed:
        type: integer
      events_with_video:
        type: integer
      failed:
        type: integer
      last_event:
        type: string
      license_plate:
        type: string
      no_clip:
        type: integer
      vehicle_id:
        type: integer
    type: object
  dashcam.ClipTypeDTO:
    properties:
      bytes:
        type: integer
      clips:
        type: integer
      code:
        type: integer
      events:
        type: integer
      events_camera_didnt_send:
        type: integer
      events_save_failed:
        type: integer
      events_with_video:
        type: integer
      failed:
        type: integer
      name:
        type: string
      no_clip:
        type: integer
    type: object
  dashcam.DTO:
    properties:
      channel_names:
        type: string
      channels:
        type: integer
      device_name:
        type: string
      driver_name:
        type: string
      id:
        type: integer
      is_demo:
        description: 'IsDemo: a copy of another account''s camera, shown here for
          a demo.'
        type: boolean
      license_plate:
        type: string
      online:
        type: boolean
      vehicle_id:
        type: integer
      vehicle_type:
        type: string
      vss_device_id:
        type: string
    type: object
  dashcam.DownloadRequest:
    properties:
      alarm_id:
        description: |-
          AlarmID links an SD-card pull to the camera event it replaces, so the
          Saved Evidence summary counts that event as saved. Optional; it must be
          an event this camera already has a clip row for.
        type: string
      channel:
        type: integer
      lat:
        type: number
      lon:
        type: number
      note:
        type: string
      path:
        type: string
      start:
        type: string
      stop:
        type: string
    type: object
  document.CreateRequest:
    properties:
      expiry:
        description: YYYY-MM-DD; drives expiry reminders
        type: string
      filename:
        type: string
      kind:
        description: STNK | KIR | SIM | INSURANCE | OTHER
        type: string
      mime:
        type: string
      number:
        description: document number as printed
        type: string
      owner_id:
        type: integer
      owner_type:
        description: vehicle | driver
        type: string
      size:
        type: integer
    type: object
  document.CreateResponse:
    properties:
      expires_in_seconds:
        type: integer
      id:
        type: integer
      required_headers:
        additionalProperties:
          type: string
        description: |-
          The client MUST send exactly these on the PUT or S3 rejects the
          signature. Returned explicitly so the caller does not have to infer them.
        type: object
      s3_key:
        type: string
      upload_url:
        type: string
    type: object
  document.VehicleDocument:
    properties:
      expiry:
        type: string
      has_file:
        type: boolean
      id:
        type: integer
      kind:
        type: string
      mime:
        type: string
      number:
        type: string
      title:
        type: string
      uploaded_at:
        type: string
    type: object
  driver.CreateRequest:
    properties:
      employee_no:
        type: string
      full_name:
        type: string
      license_class:
        type: string
      license_expiry:
        type: string
      license_no:
        type: string
      phone:
        type: string
      role:
        type: string
      status:
        type: string
    type: object
  driver.DTO:
    properties:
      created_at:
        type: string
      employee_no:
        type: string
      full_name:
        type: string
      id:
        type: integer
      license_class:
        type: string
      license_expiry:
        type: string
      license_no:
        type: string
      phone:
        type: string
      role:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  driver.UpdateRequest:
    properties:
      employee_no:
        type: string
      full_name:
        type: string
      license_class:
        type: string
      license_expiry:
        type: string
      license_no:
        type: string
      phone:
        type: string
      role:
        type: string
      status:
        type: string
    type: object
  features.Def:
    properties:
      dev:
        description: |-
          Dev marks a roadmap module that isn't built yet: it appears in the
          configurator (so an account can pre-enable it) and the sidebar shows it as
          a stub, but there's no working page behind it yet.
        type: boolean
      key:
        type: string
      label:
        type: string
      parent:
        type: string
    type: object
  fleetgroup.DTO:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  fleetgroup.WriteRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  fuel.BrandCount:
    properties:
      brand:
        type: string
      count:
        type: integer
    type: object
  fuel.ListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/fuel.Station'
        type: array
      truncated:
        type: boolean
    type: object
  fuel.Station:
    properties:
      brand:
        type: string
      id:
        type: integer
      lat:
        type: number
      lon:
        type: number
      name:
        type: string
    type: object
  fuelanalysis.Response:
    properties:
      days:
        type: integer
      idle_lph:
        type: number
      price_per_litre:
        type: number
      rows:
        items:
          $ref: '#/definitions/fuelanalysis.Row'
        type: array
      totals:
        $ref: '#/definitions/fuelanalysis.Totals'
    type: object
  fuelanalysis.Row:
    properties:
      cost:
        description: estimated fuel cost
        type: number
      distance_km:
        type: number
      fleet_group:
        type: string
      idle_cost:
        type: number
      idle_hours:
        type: number
      idle_litres:
        description: estimated fuel burned idling
        type: number
      kmpl:
        description: configured efficiency
        type: number
      license_plate:
        type: string
      litres:
        description: estimated fuel used (nil = no km/L set)
        type: number
      range_km:
        description: full-tank range
        type: number
      refuels:
        description: litres / tank size
        type: number
      tank_litres:
        description: configured tank size
        type: number
      vehicle_id:
        type: integer
      vehicle_type:
        type: string
    type: object
  fuelanalysis.Totals:
    properties:
      cost:
        type: number
      distance_km:
        type: number
      idle_cost:
        type: number
      idle_litres:
        type: number
      litres:
        type: number
      vehicles:
        type: integer
    type: object
  geofence.AssignedVehicle:
    properties:
      license_plate:
