      points:
        type: integer
      refuel_events:
        type: integer
      refuel_liters:
        type: number
      refuel_pct:
        type: number
      refuels:
        description: where + how much + cost, per refuel
        items:
          $ref: '#/definitions/liveview.RefuelEvent'
        type: array
      tank_liters:
        description: from the vehicle record
        type: number
      used_liters:
        description: tank × used_pct (nil = no tank set)
        type: number
      used_pct:
        description: total drop (consumption), refuel-adjusted
        type: number
    type: object
