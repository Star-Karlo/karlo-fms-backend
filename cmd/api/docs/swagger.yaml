  /v1/trackers/{id}/transfer:
    post:
      consumes:
      - application/json
      description: Moves ownership of a device. Master data owns the device register,
        so the authoritative write happens there; this service then takes the device
        off whatever truck it was on, marks its own row inactive, and lets the projection
        bring it in under the new account — which keeps the OLD account's fit history
        readable, so telemetry recorded while the device was theirs still resolves
        to their truck. The device appears for the new account within a minute (sooner
        on the master-data notice). Refuses if the device is not paired with master
        data, because an unpaired device cannot be moved anywhere that would stick.
      parameters:
      - description: tracker id
        in: path
        name: id
        required: true
        type: integer
      - description: destination account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/tracker.TransferRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tracker.TransferResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: not paired with master data, or the destination has no company
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: master data refused the transfer
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Hand a tracker to another account (platform admin)
      tags:
      - trackers
  /v1/trackers/{id}/unassign:
    post:
      description: Clears the link from BOTH sides — the vehicle's tracker and the
        tracker's vehicle — and closes the open period in the fit history, so the
        device is free to fit elsewhere and the truck shows as untracked. The device
        itself is kept, with its history; deleting it is a different action. Mirrored
        to master data as an unfit. Does nothing (and answers 200) if the device is
        already unassigned.
      parameters:
      - description: tracker id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tracker.UnassignResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Take a tracker off its vehicle (keep the device)
      tags:
      - trackers
