  customreport.Format:
    enum:
    - xlsx
    - pdf
    - docx
    - csv
    type: string
    x-enum-varnames:
    - FormatXLSX
    - FormatPDF
    - FormatDOCX
    - FormatCSV
  customreport.Range:
    properties:
      from:
        description: RFC3339, only when Preset is empty
        type: string
      preset:
        allOf:
        - $ref: '#/definitions/customreport.RangePreset'
        description: Preset is one of the RangePreset values. When set, From/To are
          ignored.
      to:
        type: string
    type: object
  customreport.RangePreset:
    enum:
    - today
    - yesterday
    - last_7_days
    - last_30_days
    - this_month
    - last_month
    - ""
    type: string
    x-enum-comments:
      RangeAbsolute: use From/To
    x-enum-descriptions:
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - use From/To
    x-enum-varnames:
    - RangeToday
    - RangeYesterday
    - Range7Days
    - Range30Days
    - RangeThisMonth
    - RangeLastMonth
    - RangeAbsolute
  customreport.Schedule:
    properties:
      cadence:
        $ref: '#/definitions/customreport.Cadence'
      day_of_month:
        type: integer
      day_of_week:
        description: DayOfWeek is 0=Sunday, weekly only. DayOfMonth is 1-28, monthly
          only.
        type: integer
      enabled:
        type: boolean
      format:
        $ref: '#/definitions/customreport.Format'
      hour:
        type: integer
      id:
        type: integer
      last_error:
        type: string
      last_run_at:
        type: string
      last_status:
        type: string
      next_run_at:
        type: string
      recipients:
        items:
          type: string
        type: array
      report_id:
        type: integer
      report_name:
        description: |-
          ReportName is joined in for display, so a list of schedules is readable
          without a second request per row.
        type: string
      subject:
        type: string
      timezone:
        type: string
    type: object
  customreport.Section:
    properties:
      columns:
        description: |-
          Columns optionally narrows and reorders the source's columns, and can
          rename them. Empty means "all of them, as the source ordered them".

          Renaming matters more than it looks: the point of a custom report is
          often that someone downstream expects "Nopol" where we say
          "license_plate", and forcing them to rename it every month is exactly
          the friction this feature exists to remove.
        items:
          $ref: '#/definitions/customreport.Column'
        type: array
      note:
        description: Note is printed under the section, for context the numbers do
          not carry.
        type: string
      params:
        additionalProperties: {}
        type: object
      source:
        description: a catalog key, e.g. "vehicle-trip-summary"
        type: string
      title:
        type: string
    type: object
  customreport.Spec:
    properties:
      format:
        allOf:
        - $ref: '#/definitions/customreport.Format'
        description: Format is the default the user picked; the download can override
          it.
      name:
        type: string
      narrative:
        description: |-
          Narrative overrides the by-format default: prose for pdf/docx, raw tables
          for xlsx/csv. Nil means "use the default", which is almost always right —
          the point is that the same saved report gives an executive a readable
          document and an analyst a spreadsheet, without being configured twice.
        type: boolean
      notes:
        description: free text printed under the title
        type: string
      range:
        $ref: '#/definitions/customreport.Range'
      sections:
        items:
          $ref: '#/definitions/customreport.Section'
        type: array
      version:
        type: integer
    type: object
