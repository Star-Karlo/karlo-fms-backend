      length_m:
        type: number
      license_plate:
        type: string
      manufacturer:
        type: string
      max_weight_kg:
        type: number
      notes:
        type: string
      odometer:
        type: number
      status:
        type: string
      tracker_id:
        type: integer
      unit_year:
        type: integer
      vehicle_type:
        type: string
      width_m:
        type: number
    type: object
  vehicle.DTO:
    properties:
      axles:
        description: |-
          Toll class and lorry dimensions.

          Axles decides the toll class — 2 is Golongan II, 3 is III, 4 is IV, 5 or
          more is V — and nil means UNKNOWN, never a default. A guessed class
          misprices every truck that has a real axle count, and does it invisibly
          because the figure looks precise.

          GolonganOverride exists because two axles is ambiguous: BPJT splits
          two-axle vehicles between Golongan I ("pick up / truk kecil") and
          Golongan II on size, which an axle count cannot decide.

          The dimensions let routing apply the height, width and weight limits it
          already reads from OpenStreetMap; without them every route uses
          fleet-wide defaults.
        type: integer
      box_type:
        type: string
      color:
        type: string
      created_at:
        type: string
      current_driver_id:
        type: integer
      driver_name:
        type: string
      driver_phone:
        type: string
      fleet_group_id:
        type: integer
      fleet_group_name:
        type: string
      fuel_ratio_kmpl:
        type: number
      fuel_tank_liters:
        type: number
      garage:
        type: string
      golongan_override:
        type: integer
      height_m:
        type: number
      hourmeter:
        type: number
      hull_no:
        type: string
      id:
        type: integer
      length_m:
        type: number
      license_plate:
        type: string
      manufacturer:
        type: string
      master_data_id:
        description: |-
          MasterDataID pairs the row with karlo_masterdata (the id TMS uses).
          Null until vehiclesync or write-through has paired it.
        type: string
      max_weight_kg:
        type: number
      notes:
        type: string
      odometer:
        type: number
      status:
        type: string
      tenant_id:
        description: Owning account — populated only in the platform-admin cross-account
          list.
        type: integer
      tenant_name:
        type: string
      tracker_id:
        type: integer
      tracker_imei:
        type: string
      tracker_phone:
        type: string
      unit_year:
        type: integer
      updated_at:
        type: string
      vehicle_type:
        type: string
      width_m:
        type: number
    type: object
  vehicle.RemoveResult:
    properties:
      archived:
        description: Archived is true for the first step, Deleted for the second.
        type: boolean
      deleted:
        type: boolean
      removed:
        additionalProperties:
          format: int64
          type: integer
        description: |-
          Removed counts the dependent FMS rows a hard delete destroyed, by kind,
          so the answer can say what was lost rather than just "ok".
        type: object
    type: object
  vehicle.UpdateRequest:
    properties:
      axles:
        type: integer
      box_type:
        type: string
      fleet_group_id:
        type: integer
      fuel_ratio_kmpl:
        type: number
      fuel_tank_liters:
        type: number
      garage:
        type: string
      golongan_override:
        type: integer
      height_m:
        type: number
      hourmeter:
        type: number
      hull_no:
        type: string
      length_m:
        type: number
      license_plate:
        type: string
      manufacturer:
        type: string
      max_weight_kg:
        type: number
      notes:
        type: string
      odometer:
        type: number
      status:
        type: string
      unit_year:
        type: integer
      vehicle_type:
        type: string
      width_m:
        type: number
    type: object
  webhook.Endpoint:
    properties:
      created_at:
        type: string
      enabled:
        type: boolean
      event_filter:
        type: string
      has_secret:
        type: boolean
      id:
        type: integer
      updated_at:
        type: string
      url:
        type: string
    type: object
  webhook.upsertReq:
    properties:
      enabled:
        type: boolean
      event_filter:
        type: string
      secret:
        description: nil = leave unchanged on update
        type: string
      url:
        type: string
    type: object
info:
  contact: {}
  description: 'Application API for the Fleet Management System: authentication, master
    data, and live vehicle tracking (joined with the telemetry service).'
  title: Karlo FMS Platform API
  version: "0.1"
paths:
  /public/track/{token}:
    get:
      parameters:
      - description: link token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/trackinglink.PublicResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "410":
          description: Gone
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Public live view for a shared tracking link (no auth)
      tags:
      - tracking-links
  /v1/admin/restore:
    post:
      consumes:
      - application/json
      description: Pulls archived alerts/driving_events for a date range back into
        the database for the caller's tenant. Idempotent (already-present rows are
        skipped). Runs in the background; watch the service logs for the final counts.
      parameters:
      - description: Table and inclusive date range
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/retention.RestoreRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Restore archived rows from cold storage (admin)
      tags:
      - admin
  /v1/ai/dashboard/compose:
    post:
      consumes:
      - application/json
      description: |-
        Given the caller's role, a natural-language description and the
        client's metric catalog, returns a list of tiles (metric + params +
        visualisation + layout). The caller validates and may reject them —
        the model is a proposer, not an authority.
      parameters:
      - description: prompt + catalog
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/aidash.composeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/aidash.composeResponse'
        "400":
          description: prompt or catalog missing
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: AI composition not configured
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Compose a dashboard from a description
      tags:
      - ai
  /v1/ai/notification-rules/compose:
    post:
      consumes:
      - application/json
      description: |-
        Given a natural-language request, returns a list of proposed
        notification rules (event + count threshold + time window +
        urgency). The caller reviews and saves them — the model proposes,
        it does not persist.
      parameters:
      - description: prompt
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/airule.composeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/airule.composeResponse'
        "400":
          description: prompt missing
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: AI composition not configured
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Compose notification rules from a description
      tags:
      - ai
  /v1/ai/report/compose:
    post:
      consumes:
      - application/json
      description: Turns a description (and optionally a spreadsheet's headers) into
        a report spec. The spec is returned for review; nothing is saved.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/aireport.composeResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Compose a custom report with AI
      tags:
      - ai
  /v1/ai/report/inspect-file:
    post:
      consumes:
      - multipart/form-data
      description: Reads column headers and a few sample rows from an .xlsx so a report
        can be shaped to match it. The file is never stored.
      parameters:
      - description: an .xlsx file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/aireport.inspectResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Inspect an uploaded spreadsheet
      tags:
      - ai
  /v1/alert-taxonomy:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/alert.AlertType'
            type: array
      security:
      - BearerAuth: []
      summary: The master alert taxonomy
      tags:
      - alerts
  /v1/alerts:
    get:
      parameters:
      - description: search
        in: query
        name: q
        type: string
      - description: unchecked|followed_up|checked|false_alert (or 'open' = unchecked+followed_up)
        in: query
        name: check_status
        type: string
      - description: gps|camera
        in: query
        name: device_source
        type: string
      - description: urgent|important|info
        in: query
        name: severity
        type: string
      - description: taxonomy code
        in: query
        name: alert_code
        type: string
      - description: vehicle filter
        in: query
        name: vehicle_id
        type: integer
      - description: RFC3339
        in: query
        name: from
        type: string
      - description: RFC3339
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_karlo_fms-backend_internal_platform_httpx.List-alert_DTO'
      security:
      - BearerAuth: []
      summary: List alerts (Notification feed)
      tags:
      - alerts
  /v1/alerts/{id}:
    get:
      parameters:
      - description: alert id
        in: path
        name: id
        required: true
        type: integer
      - description: RFC3339 hint — enables cold-storage lookup for an archived alert
        in: query
        name: occurred_at
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/alert.Detail'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Alert detail with surrounding same-vehicle history
      tags:
      - alerts
  /v1/alerts/{id}/check:
    patch:
      consumes:
      - application/json
      parameters:
      - description: alert id
        in: path
        name: id
        required: true
        type: integer
      - description: status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/alert.CheckRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/alert.DTO'
      security:
      - BearerAuth: []
      summary: Set an alert's lifecycle status (unchecked=open / followed_up / checked=resolved
        / false_alert)
      tags:
      - alerts
  /v1/alerts/analytics:
    get:
      parameters:
      - description: RFC3339
        in: query
        name: from
        type: string
      - description: RFC3339
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/alert.Analytics'
      security:
      - BearerAuth: []
      summary: Alert analytics for the Safety dashboard
      tags:
      - alerts
  /v1/alerts/summary:
    get:
      description: 'The fleet''s incidents for a window, counted in the database:
        one entry per vehicle with a map of alert code to count, plus the fleet-wide
        tally. Checked and unchecked alike — the question is what happened, not what
        is outstanding. There is NO ROW LIMIT here, which is the point: /v1/alerts
        caps at 500 rows, so counting that list is accurate only until a fleet has
        a busy day. Scoped to the caller''s account (?account_id for platform staff)
        exactly as /v1/alerts is. Covers alerts still in the database; anything aged
        out to cold storage must be restored first.'
      parameters:
      - description: RFC3339 window start
        in: query
        name: from
        required: true
        type: string
      - description: RFC3339 window end (default now)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/alert.AlertSummary'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Alert counts per vehicle per code over a window
      tags:
      - alerts
  /v1/analytics/fleet:
    get:
      description: Live fleet-wide speed distribution, overspeeder + top-speed lists,
        average moving speed and province spread, derived from the latest GPS positions.
      parameters:
      - description: overspeed threshold km/h (default 60)
        in: query
        name: limit
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/liveview.FleetAnalytics'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Fleet speed & behavior analytics (live, from GPS)
      tags:
      - analytics
  /v1/analytics/history:
    get:
      description: Per-day moving/idle/parked hours, distance and idle share, plus
        per-vehicle totals over the window. Days are Asia/Jakarta.
      parameters:
      - description: window length, 1-8 (default 7)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/liveview.FleetHistory'
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Fleet history (daily)
      tags:
      - analytics
  /v1/api-tokens:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_karlo_fms-backend_internal_platform_httpx.List-apitoken_DTO'
      security:
      - BearerAuth: []
      summary: List API tokens (admin)
      tags:
      - api-tokens
    post:
      consumes:
      - application/json
      parameters:
      - description: token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/apitoken.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/apitoken.DTO'
      security:
      - BearerAuth: []
      summary: Create an API token (admin) — the secret is returned once
      tags:
      - api-tokens
  /v1/api-tokens/{id}:
    delete:
      description: 'Two steps, like deleting a vehicle. On a live token this REVOKES
        it: the key stops working immediately, and the row stays so the list can still
        say what it was called and when it was last used — which is how you find out
        whether anything was still calling with it. Called again on a token that is
        already revoked, it DELETES the row. The answer says which step ran. A key
        owned by the shared auth service can be deleted from this list, but revoking
        it there is what stops it working.'
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apitoken.RemoveResult'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Revoke an API token, and delete it on the second call (admin)
      tags:
      - api-tokens
  /v1/auth/change-password:
    post:
      consumes:
      - application/json
      description: Verifies the current password, then sets a new one. ALL other sessions
        are signed out — a password change is what someone does when they suspect
        a credential is compromised, so other refresh tokens must not survive it.
        A fresh token pair is returned, so the caller stays signed in on this device
        and should replace its stored tokens with these.
      parameters:
      - description: current and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change your own password
      tags:
      - auth
  /v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log in with email + password
      tags:
      - auth
  /v1/auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: refresh token to revoke
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Revoke a refresh token
      tags:
      - auth
  /v1/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserDTO'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Current authenticated user
      tags:
      - auth
  /v1/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Rotate a refresh token for a new token pair
      tags:
      - auth
  /v1/catalog/{kind}:
    get:
      description: 'Master data''s catalogue as this account sees it: Karlo''s shared
        entries plus the account''s own. The vehicle form''s manufacturer picker reads
        brand, box type reads truck_body, and vehicle type reads truck_head (with
        truck_body as the fallback vocabulary). Empty when master data is not configured
        — the fields then stay free text.'
      parameters:
      - description: brand | truck_body | truck_head
        in: path
        name: kind
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/vehicle.CatalogEntry'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Catalogue entries for the vehicle form (brand, truck body, truck head)
      tags:
      - vehicles
    post:
      consumes:
      - application/json
      description: Creates the entry in master data as the calling user — company-scoped
        for a customer, shared for platform staff — so a value the fleet needs exists
        once for both products. truck_head is Karlo-maintained and cannot be added
        here. An existing entry of the same name (case-insensitive) is returned rather
        than duplicated.
      parameters:
      - description: brand | truck_body
        in: path
        name: kind
        required: true
        type: string
      - description: '{\'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/vehicle.CatalogEntry'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: kind is Karlo-maintained
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add a catalogue entry (brand or truck body) for this account
      tags:
      - vehicles
  /v1/company/logo:
    delete:
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Remove the company logo (admin only)
      tags:
      - company
    get:
      description: Longer-lived than a document link because the logo is rendered
        inline on every page that shows it; a five-minute URL would expire while a
        report was still open.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Presigned URL to display the company logo
      tags:
      - company
    post:
      consumes:
      - application/json
      description: 'Same two-step flow as document upload: this returns a short-lived
        S3 PUT URL signed with the exact size and content type. One logo per company
        — uploading replaces the previous one.'
      parameters:
      - description: file metadata
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/company.LogoUploadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Presigned URL for uploading the company logo (admin only)
      tags:
      - company
  /v1/company/sop:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sop.Settings'
      security:
      - BearerAuth: []
      summary: The company's operating-procedure thresholds (SOP)
      tags:
      - company
    put:
      consumes:
      - application/json
      parameters:
      - description: settings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/sop.Settings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sop.Settings'
      security:
      - BearerAuth: []
      summary: Set the company's SOP thresholds (admin)
      tags:
      - company
