  insight.Anomaly:
    properties:
      baseline:
        type: number
      change_pct:
        type: number
      fleet_group:
        type: string
      headline:
        description: |-
          Headline is a ready-to-display sentence, built server-side so every client
          and the AI narrator describe a finding identically.
        type: string
      license_plate:
        type: string
      metric:
        description: 'Metric is which measure moved: idle_pct | distance | moving_hours
          | stopped.'
        type: string
      recent:
