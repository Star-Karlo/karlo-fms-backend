# Production deploy for the api service — MANUAL ONLY (this is the gate).
#
# Pushing to main no longer deploys; it only runs CI (ci.yml). To ship to
# production: Actions -> "deploy-api" -> "Run workflow", tick the checklist,
# and type DEPLOY to confirm. That click is the approval.
#
# Repo settings (Settings → Secrets and variables → Actions):
#   Secret: AWS_ROLE_ARN
#   Vars:   AWS_REGION=ap-southeast-1, ECS_CLUSTER=karlo-fms, ECS_SERVICE=api,
#           ECR_REPO=karlo-fms/api
name: deploy-api

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY (capitals) to confirm a PRODUCTION deploy'
        required: true
        default: ''
      migrations_applied:
        description: 'DB migrations for this change are applied (or none needed)'
        type: boolean
        default: false
      verified:
        description: 'Change has been built and verified'
        type: boolean
        default: false

permissions:
  id-token: write # for AWS OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm + record checklist
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Type DEPLOY (capitals) in the confirm box to proceed."
            exit 1
          fi
          {
            echo "## Production deploy — api"
            echo "| item | value |"
            echo "|---|---|"
            echo "| triggered by | ${{ github.actor }} |"
            echo "| ref / commit | ${{ github.ref_name }} @ ${{ github.sha }} |"
            echo "| migrations applied | ${{ inputs.migrations_applied }} |"
            echo "| verified | ${{ inputs.verified }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.migrations_applied }}" != "true" ] || [ "${{ inputs.verified }}" != "true" ]; then
            echo "::warning::Proceeding with an unchecked checklist item — make sure that is intentional."
          fi

      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ vars.ECR_REPO }}
          TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 --build-arg SERVICE=api \
            -t "$REGISTRY/$REPO:$TAG" -t "$REGISTRY/$REPO:latest" .
          docker push "$REGISTRY/$REPO:$TAG"
          docker push "$REGISTRY/$REPO:latest"

      - name: Roll ECS service
        run: |
          aws ecs update-service --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}"
