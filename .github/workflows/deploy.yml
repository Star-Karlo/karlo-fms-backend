# Production deploy for the api service — MANUAL ONLY (this is the gate).
#
# Pushing to main no longer deploys; it only runs CI (ci.yml). To ship to
# production: Actions -> "deploy-api" -> "Run workflow", tick the checklist,
# and type DEPLOY to confirm. That click is the approval.
#
# Repo settings (Settings → Secrets and variables → Actions):
#   Secret: AWS_ROLE_ARN
#   Vars:   AWS_REGION=ap-southeast-1, ECS_CLUSTER=karlo-fms, ECS_SERVICE=api,
#           ECR_REPO=karlo-fms/api
name: deploy-api

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY (capitals) to confirm a PRODUCTION deploy'
        required: true
        default: ''
      migrations_applied:
        description: 'DB migrations for this change are applied (or none needed)'
        type: boolean
        default: false
      verified:
        description: 'Change has been built and verified'
        type: boolean
        default: false

permissions:
  id-token: write # for AWS OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm + record checklist
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Type DEPLOY (capitals) in the confirm box to proceed."
            exit 1
          fi
          {
            echo "## Production deploy — api"
            echo "| item | value |"
            echo "|---|---|"
            echo "| triggered by | ${{ github.actor }} |"
            echo "| ref / commit | ${{ github.ref_name }} @ ${{ github.sha }} |"
            echo "| migrations applied | ${{ inputs.migrations_applied }} |"
            echo "| verified | ${{ inputs.verified }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.migrations_applied }}" != "true" ] || [ "${{ inputs.verified }}" != "true" ]; then
            echo "::warning::Proceeding with an unchecked checklist item — make sure that is intentional."
          fi

      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Apply pending DB migrations BEFORE rolling the service, so new code never
      # runs against an old schema (the failure mode that bit us before this
      # existed). Opens the RDS security group to this runner just for the
      # migration and revokes it on exit; connects as the DB master. Only
      # migrations not yet in schema_migrations are applied.
      - name: Apply DB migrations
        env:
          REGION: ${{ vars.AWS_REGION }}
          INSTANCE: karlo-fms-app
          SG: sg-06d617c320fda9b45
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          read -r HOST PORT DBUSER SECRET <<<"$(aws rds describe-db-instances --region "$REGION" \
            --db-instance-identifier "$INSTANCE" \
            --query 'DBInstances[0].[Endpoint.Address,Endpoint.Port,MasterUsername,MasterUserSecret.SecretArn]' --output text)"
          export PGPASSWORD="$(aws secretsmanager get-secret-value --region "$REGION" --secret-id "$SECRET" \
            --query SecretString --output text | python3 -c 'import sys,json;print(json.load(sys.stdin)["password"])')"
          IP="$(curl -s https://checkip.amazonaws.com | tr -d '\n')"
          RULE="$(aws ec2 authorize-security-group-ingress --region "$REGION" --group-id "$SG" \
            --ip-permissions "IpProtocol=tcp,FromPort=5432,ToPort=5432,IpRanges=[{CidrIp=${IP}/32,Description=ci-migrate}]" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' --output text)"
          trap 'aws ec2 revoke-security-group-ingress --region "$REGION" --group-id "$SG" --security-group-rule-ids "$RULE" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 24); do pg_isready -h "$HOST" -p "$PORT" -U "$DBUSER" -t 5 >/dev/null 2>&1 && break; sleep 5; done
          export DB_URL="host=$HOST port=$PORT user=$DBUSER dbname=fms_app sslmode=require"
          bash scripts/ci-migrate.sh

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ vars.ECR_REPO }}
          TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 --build-arg SERVICE=api \
            -t "$REGISTRY/$REPO:$TAG" -t "$REGISTRY/$REPO:latest" .
          docker push "$REGISTRY/$REPO:$TAG"
          docker push "$REGISTRY/$REPO:latest"

      - name: Roll ECS service
        run: |
          aws ecs update-service --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}"
