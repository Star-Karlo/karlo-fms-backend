# Production deploy for the api service — MANUAL ONLY (this is the gate).
#
# Pushing to main no longer deploys; it only runs CI (ci.yml). To ship to
# production: Actions -> "deploy-api" -> "Run workflow", tick the checklist,
# and type DEPLOY to confirm. That click is the approval.
#
# Repo settings (Settings → Secrets and variables → Actions):
#   Secret: AWS_ROLE_ARN
#   Vars:   AWS_REGION=ap-southeast-1, ECS_CLUSTER=karlo-fms, ECS_SERVICE=api,
#           ECR_REPO=karlo-fms/api
#   Vars (jakarta): JAKARTA_ECS_CLUSTER, JAKARTA_MIGRATE_TASKDEF,
#           JAKARTA_TASK_NETWORK — the last is the JSON from
#           `terraform output -raw migrate_network` in infra/jakarta.
#
# TWO TARGETS during the Jakarta relocation. `singapore` is the running stack
# above. `jakarta` is FMS inside the platform VPC (karlo-fms-infra/infra/
# jakarta): different region, the platform's ECR repo and cluster, and — the
# part that is not a rename — migrations run as a one-off task INSIDE the VPC,
# because the Jakarta RDS has no public address for a runner to reach. After
# Singapore is torn down the default flips and the singapore steps go.
name: deploy-api

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY (capitals) to confirm a PRODUCTION deploy'
        required: true
        default: ''
      migrations_applied:
        description: 'DB migrations for this change are applied (or none needed)'
        type: boolean
        default: false
      verified:
        description: 'Change has been built and verified'
        type: boolean
        default: false
      target:
        description: 'Which stack to deploy'
        type: choice
        options: [singapore, jakarta]
        default: singapore

permissions:
  id-token: write # for AWS OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm + record checklist
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Type DEPLOY (capitals) in the confirm box to proceed."
            exit 1
          fi
          {
            echo "## Production deploy — api"
            echo "| item | value |"
            echo "|---|---|"
            echo "| triggered by | ${{ github.actor }} |"
            echo "| ref / commit | ${{ github.ref_name }} @ ${{ github.sha }} |"
            echo "| target | ${{ inputs.target }} |"
            echo "| migrations applied | ${{ inputs.migrations_applied }} |"
            echo "| verified | ${{ inputs.verified }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.migrations_applied }}" != "true" ] || [ "${{ inputs.verified }}" != "true" ]; then
            echo "::warning::Proceeding with an unchecked checklist item — make sure that is intentional."
          fi

      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.target == 'jakarta' && 'ap-southeast-3' || vars.AWS_REGION }}

      # Apply pending DB migrations BEFORE rolling the service, so new code never
      # runs against an old schema (the failure mode that bit us before this
      # existed). Opens the RDS security group to this runner just for the
      # migration and revokes it on exit; connects as the DB master. Only
      # migrations not yet in schema_migrations are applied.
      - name: Apply DB migrations (singapore — psql from the runner)
        if: inputs.target == 'singapore'
        env:
          REGION: ${{ vars.AWS_REGION }}
          INSTANCE: karlo-fms-app
          SG: sg-06d617c320fda9b45
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          read -r HOST PORT DBUSER SECRET <<<"$(aws rds describe-db-instances --region "$REGION" \
            --db-instance-identifier "$INSTANCE" \
            --query 'DBInstances[0].[Endpoint.Address,Endpoint.Port,MasterUsername,MasterUserSecret.SecretArn]' --output text)"
          export PGPASSWORD="$(aws secretsmanager get-secret-value --region "$REGION" --secret-id "$SECRET" \
            --query SecretString --output text | python3 -c 'import sys,json;print(json.load(sys.stdin)["password"])')"
          IP="$(curl -s https://checkip.amazonaws.com | tr -d '\n')"
          RULE="$(aws ec2 authorize-security-group-ingress --region "$REGION" --group-id "$SG" \
            --ip-permissions "IpProtocol=tcp,FromPort=5432,ToPort=5432,IpRanges=[{CidrIp=${IP}/32,Description=ci-migrate}]" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' --output text)"
          trap 'aws ec2 revoke-security-group-ingress --region "$REGION" --group-id "$SG" --security-group-rule-ids "$RULE" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 24); do pg_isready -h "$HOST" -p "$PORT" -U "$DBUSER" -t 5 >/dev/null 2>&1 && break; sleep 5; done
          export DB_URL="host=$HOST port=$PORT user=$DBUSER dbname=fms_app sslmode=require"
          bash scripts/ci-migrate.sh

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          # Singapore: FMS's own repo. Jakarta: the platform's, created by
          # platform-terraform when FMS was added to its service list.
          REPO: ${{ inputs.target == 'jakarta' && 'karlo/fms-api' || vars.ECR_REPO }}
          TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 --build-arg SERVICE=api \
            -t "$REGISTRY/$REPO:$TAG" -t "$REGISTRY/$REPO:latest" .
          docker push "$REGISTRY/$REPO:$TAG"
          # The platform's repositories have IMMUTABLE tags: :latest is
          # whatever was pushed first and can never move. Jakarta deploys
          # therefore pin every task definition to the commit's tag below
          # and never push :latest; Singapore keeps its moving tag.
          if [ "${{ inputs.target }}" != "jakarta" ]; then
            docker push "$REGISTRY/$REPO:latest"
          fi

      # Jakarta: migrations run INSIDE the VPC as a one-off task from the image
      # just pushed. It carries cmd/migrate-schema and db/migrations, and
      # connects as the owner role via its own secret. The step waits for the
      # task and fails the deploy on a non-zero exit, so new code never rolls
      # onto an old schema — the same guarantee the psql step gives Singapore.
      - name: Apply DB migrations (jakarta — one-off task in the VPC)
        if: inputs.target == 'jakarta'
        env:
          CLUSTER: ${{ vars.JAKARTA_ECS_CLUSTER }}
          TASKDEF: ${{ vars.JAKARTA_MIGRATE_TASKDEF }}
          NETWORK: ${{ vars.JAKARTA_TASK_NETWORK }}
        run: |
          # Register a revision of the migrate task pinned to the image just
          # pushed (tags are immutable there; :latest never moves), so the SQL
          # that runs is exactly the SQL this commit shipped.
          IMAGE="${{ steps.ecr.outputs.registry }}/karlo/fms-api:${{ github.sha }}"
          REV="$(bash scripts/register-revision.sh "$TASKDEF" "$IMAGE")"
          echo "migrate task definition: $TASKDEF:$REV"
          ARN="$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$TASKDEF:$REV" \
            --launch-type FARGATE --network-configuration "$NETWORK" \
            --query 'tasks[0].taskArn' --output text)"
          echo "migrate task: $ARN"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$ARN"
          CODE="$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)"
          REASON="$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$ARN" \
            --query 'tasks[0].stoppedReason' --output text)"
          echo "exit=$CODE reason=$REASON"
          [ "$CODE" = "0" ] || { echo "::error::migrations failed (exit $CODE) — see /ecs/karlo-prod-fms-migrate"; exit 1; }

      - name: Roll ECS service
        env:
          CLUSTER: ${{ inputs.target == 'jakarta' && vars.JAKARTA_ECS_CLUSTER || vars.ECS_CLUSTER }}
          SERVICE: ${{ inputs.target == 'jakarta' && 'karlo-prod-fms-api' || vars.ECS_SERVICE }}
        run: |
          if [ "${{ inputs.target }}" = "jakarta" ]; then
            # Pin the api to this commit's image via a new revision; the
            # service's task_definition is ignored by Terraform for exactly
            # this reason.
            IMAGE="${{ steps.ecr.outputs.registry }}/karlo/fms-api:${{ github.sha }}"
            REV="$(bash scripts/register-revision.sh "$SERVICE" "$IMAGE")"
            aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$SERVICE:$REV" >/dev/null
          else
            aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment >/dev/null
          fi
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
